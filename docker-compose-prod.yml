services:
  doppelganger:
    container_name: doppelganger
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    stop_grace_period: 10m
    restart: unless-stopped
    depends_on:
      - scylla
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      - SERVER_AUTH=false
      - SERVER_DEBUG=false
      - LOGGING_LEVEL=info
      - SCYLLA_HOSTS=scylla
      - SCYLLA_KEYSPACE=doppelganger
      - SCYLLA_REPLICATION_CLASS=SimpleStrategy
      - SCYLLA_REPLICATION_FACTOR=1
      - PYROSCOPE_ADDRESS=http://pyroscope.crawl1.archive.org
  scylla:
    image: scylladb/scylla
    container_name: scylla
    command: --developer-mode=0 --overprovisioned
    privileged: true
    volumes:
      - /1/crawling/doppelganger/scylla:/var/lib/scylla