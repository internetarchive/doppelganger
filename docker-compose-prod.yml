services:
  doppelganger:
    container_name: doppelganger
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    stop_grace_period: 10m
    restart: unless-stopped
    depends_on:
      scylla:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
      - SERVER_AUTH=false
      - SERVER_DEBUG=false
      - LOGGING_LEVEL=info
      - SCYLLA_HOSTS=scylla
      - SCYLLA_KEYSPACE=doppelganger
      - SCYLLA_REPLICATION_CLASS=SimpleStrategy
      - SCYLLA_REPLICATION_FACTOR=1
      - PYROSCOPE_ADDRESS=http://pyroscope.crawl1.archive.org
  scylla:
    image: scylladb/scylla:2025.1
    container_name: scylla
    command: --developer-mode=0 --overprovisioned=1 --memory 85G
    privileged: true
    restart: unless-stopped
    volumes:
      - /1/crawling/doppelganger/scylla:/var/lib/scylla
      - ./scylla.yaml:/etc/scylla/scylla.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s